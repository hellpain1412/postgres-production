services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_prod
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      # Data persistence
      - postgres_data:/var/lib/postgresql/data:Z
      # Custom configuration
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:Z
      # Initialization scripts
      - ./init-scripts:/docker-entrypoint-initdb.d:Z
      # Backup location
      - ./backups:/backups:Z
    
    ports:
      - "127.0.0.1:5432:5432"  # Chỉ bind với localhost
    
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - postgres_network
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PgAdmin (optional - for management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_prod
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
    ports:
      - "127.0.0.1:5050:80"
    
    networks:
      - postgres_network
    
    depends_on:
      postgres:
        condition: service_healthy
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  postgres_network:
    driver: bridge
